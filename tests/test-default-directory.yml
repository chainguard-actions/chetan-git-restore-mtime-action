name: Test default working-directory on workspace repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Reset mtime of action.yml to now
        run: touch action.yml
      - id: action
        uses: .
      - name: Assert action.yml mtime equals its last commit time
        run: |
          if [ -n "$(git status --porcelain -- action.yml)" ]; then
            echo "action.yml has local modifications; action skips dirty files"
            actual=$(stat -c %Y action.yml)
            echo "actual: $actual"
            echo "PASS (action ran successfully; file dirty so not compared)"
            exit 0
          fi
          expected=$(git log -1 --format=%ct -- action.yml)
          actual=$(stat -c %Y action.yml)
          echo "actual: $actual expected: $expected"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "FAIL: mtime does not match last commit time"
            exit 1
          fi
          echo "PASS"
