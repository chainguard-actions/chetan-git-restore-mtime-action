name: Test args --commit-time (uses committer date)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a git repo with distinct author/committer dates
        run: |
          git config --global --add safe.directory '*'
          rm -rf mtime-repo
          mkdir -p mtime-repo
          cd mtime-repo
          git init -q .
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo hello > a.txt
          git add .
          GIT_AUTHOR_DATE="2020-01-01T00:00:00Z" GIT_COMMITTER_DATE="2021-01-01T00:00:00Z" \
            git commit -q -m "initial"
          touch a.txt
      - id: action
        uses: .
        with:
          working-directory: mtime-repo
          args: --commit-time
      - name: Assert mtime equals committer date
        run: |
          ACTUAL=$(stat -c %Y mtime-repo/a.txt)
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "1609459200" ]; then
            echo "FAIL: expected committer date 1609459200"
            exit 1
          fi
          echo "PASS"
