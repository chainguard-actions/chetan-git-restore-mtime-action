name: Test args --test (dry run leaves mtimes unchanged)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a git repo with a known commit date
        run: |
          git config --global --add safe.directory '*'
          rm -rf mtime-repo
          mkdir -p mtime-repo
          cd mtime-repo
          git init -q .
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo hello > a.txt
          git add .
          GIT_AUTHOR_DATE="2020-01-01T00:00:00Z" GIT_COMMITTER_DATE="2021-01-01T00:00:00Z" \
            git commit -q -m "initial"
          touch -d "2023-06-15T12:00:00Z" a.txt
          stat -c '%Y %n' a.txt
      - id: action
        uses: .
        with:
          working-directory: mtime-repo
          args: --test --verbose
      - name: Assert mtime unchanged
        run: |
          ACTUAL=$(stat -c %Y mtime-repo/a.txt)
          EXPECTED=$(date -d "2023-06-15T12:00:00Z" +%s)
          echo "actual: $ACTUAL expected: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: --test should not modify timestamps"
            exit 1
          fi
          echo "PASS"
